[MAIN]
SkipIntro = 1              // boot straight to the main menu (no logos, disclaimer or "press any key")
BootLockFix = 1            // loading-screen thread stops napping 200 ms while holding the renderer lock (loader was locked out)
SkipFacebook = 1           // skip the dead Facebook login setup (about 5 s every boot)
ShaderCache = 1            // keep compiled shaders on disk (DIFastBoot.shadercache) instead of recompiling them every boot
TextureCache = 1           // keep generated texture mip levels on disk (DIFastBoot.texcache) instead of rebuilding them every boot
FastCrashLog = 1           // crash.log lines go through the OS cache instead of waiting for the disk each (a game crash still loses nothing)
QuietLog = 1               // leave WARN lines out of crash.log (thousands of them slow the boot); errors still logged
LoadingScreenFPS = 60      // loading-screen frame cap; 0 = stock (about 20 fps)
LoadingScreenNoVSync = 1   // loading-screen frames skip the VSync wait, so they stop blocking the loader

[DEBUG]
TimingLog = 0              // 1 = write DIFastBoot.log (timestamped game log, loading-screen stats, boot profile)
VerifyCaches = 0           // 1 = still run D3DX on cache hits and log whether the cached bytes match (slow; for checking)
